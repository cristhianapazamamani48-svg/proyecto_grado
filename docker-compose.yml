services:
  postgres:
    image: postgres:16-alpine
    container_name: uub_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: uub_evaluaciones
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uub_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/uub_evaluaciones?schema=public"
      JWT_SECRET: "super-secreto-uub-evaluaciones-jwt-key-2026"
      PORT: 3001
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3001"
    container_name: uub_frontend
    restart: always
    ports:
      - "3002:3000"
    depends_on:
      - backend

  adminer:
    image: adminer:latest
    container_name: uub_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
