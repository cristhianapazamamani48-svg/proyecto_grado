services:
  postgres:
    image: postgres:16-alpine
    container_name: uub_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: uub_evaluaciones
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uub_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/uub_evaluaciones?schema=public"
      # El JWT_SECRET NO se define aquí a propósito: el servicio toma su valor
      # desde ./backend/.env (env_file) y el backend falla al arrancar si falta.
      PORT: 3001
      CORS_ORIGIN: "http://localhost:3002"
      AI_PROVIDER: "mock"
      AI_MODEL: "mock-v1"
      AI_MAX_TOKENS: "500"
      AI_TEMPERATURE: "0.3"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "/api"
    container_name: uub_frontend
    restart: always
    ports:
      - "3002:3000"
    depends_on:
      - backend

  adminer:
    image: adminer:latest
    container_name: uub_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
